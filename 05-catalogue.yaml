- name: configure catalogue server
  hosts: catalogue
  become: true
  tasks:
    - name: disable nodejs
      command: dnf module disable nodejs -y

    - name: enable nodejs 24
      command: dnf module enable nodejs:24 -y

    - name: install node js
      ansible.builtin.package:
        name: nodejs
        state: present
        
    - name: Create roboshop user
      ansible.builtin.user:
        name: roboshop
        system: true
        home: /app
        shell: /sbin/nologin
        comment: "roboshop system user"
        create_home: false
        state: present

    - name: remove the exisiting directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: remove catalogue.zip
      file:
        path: /tmp/catalogue.zip
        state: absent

    - name: create directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Download the application archive
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
        dest: /tmp/catalogue.zip

    - name: Extract the application archive
      ansible.builtin.unarchive:
        src: /tmp/catalogue.zip
        dest: /app
        remote_src: true

    - name: Install the libraries
      community.general.npm:
        path: /app

    - name: copy catalogue services
      template:
        src: catalogue.service.j2
        dest: /etc/systemd/system/catalogue.service

    - name: install mongodb-mongosh
      dnf:
        name: mongodb-mongosh
        state: present

    - name: check the products loaded or not
      command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
      register: product_count

    - name: print the product count
      ansible.builtin.debug:  
        msg: "{{ product_count }}"

    - name: load the products
      shell: mongosh --host "{{ mongodb_host }}" < /app/db/master-data.js
      when: product_count.stdout | int == 0

    - name: daemon-reload
      ansible.builtin.systemd_service:
       daemon_reload: true

    - name: start and enable catalogu e
      ansible.builtin.service:
        name: catalogue
        state: restarted
        enabled: yes
        