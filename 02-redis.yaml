- name: configure of redis
  hosts: redis
  become: yes
  tasks: 
  - name: disable redis
    command: dnf module disable redis -y
  
  - name: install redis
    ansible.builtin.package:
      name: redis
      state: present

  - name: update the address
    ansible.builtin.replace:
      regexp: 127.0.0.1
      replace: 0.0.0.0

  - name: update protected mode
    ansible.builtin.lineinfile:
      path: /etc/redis/redis.conf
      regexp: '^protected-mode yes'
      line: 'protected-mode no'

  - name: start and enable service
    ansible.builtin.package:
      name: redis
      state: present
      enabled: yes


