- name: Create EC2 instances and Route 53 records
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    instance: ["mongodb", "redis", "mysql", "rabbitmq"]
    instance_action: create
    domain_name: vinayexpense.store
    ami_id: ami-0055977a6e828a4f4

  tasks:
    - name: Create EC2 instances
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        instance_type: t3.micro
        image_id: "{{ ami_id }}"
        region: us-east-1
        wait: true
      loop: "{{ instance }}"
      register: ec2_output

    - name: Create Route 53 records
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        ttl: 60
        type: A
        record: "{{ item.item }}.{{ domain_name }}"
        overwrite: true
        value: "{{ item.instances[0].private_ip_address }}"
      loop: "{{ ec2_output.results }}"



