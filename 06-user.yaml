- name: configure cart server
  hosts: cart
  become: true
  tasks:
    - name: disable nodejs
      command: dnf module disable nodejs -y

    - name: enable nodejs:24
      command: dnf module enable nodejs:24 -y

    - name: install nodejs
      dnf:
        name: nodejs
        state: present
        
    - name: user add roboshop
      ansible.builtin.user: 
        name: roboshop
        system: true
        home: /app
        shell: /sbin/nologin 
        comment: "roboshop system user"
        create_home: false
        state: present

    - name: remove the existing directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: unzip the file
      ansible.builtin.file:
        path: /tmp/user.zip
        state: absent

    - name: create teh directory
      ansible.builtin.file:
        path: /app
        state: present

