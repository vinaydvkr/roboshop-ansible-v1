- name: configure cart server
  hosts: cart
  become: true
  tasks:
    - name: disable nodejs
      command: dnf module disable nodejs -y

    - name: enable nodejs:24
      command: dnf module enable nodejs:24 -y

    - name: install nodejs
      dnf:
        name: nodejs
        state: present
        
    - name: user add roboshop
      ansible.builtin.user: 
        name: roboshop
        system: true
        home: /app
        shell: /sbin/nologin 
        comment: "roboshop system user"
        create_home: false
        state: present

    - name: remove the existing directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: unzip the file
      ansible.builtin.file:
        path: /tmp/user.zip
        state: absent

    - name: create the directory
      ansible.builtin.file:
        path: /app
        state: present

    - name: download user application
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/user-v4.zip
        dest: /tmp/user.zip

    - name: unzip user zip
      ansible.builtin.archieve:
        src: /tmp/user.zip
        dest: /app
        remote_src: yes


