- name: configure mysql
  hosts: mysql
  become: true
  tasks:
    - name: enable mysql
      command: dnf module enable mysql:8.4 -y

    - name: install mysql
      ansible.builtin.package:
        name: mysql-server
        state: present

    - name: start and enable servie
      ansible.builtin.service:
        name: mysql
        state: start
        enabled: yes

    - name: Set root password
      command: mysql_secure_installation --set-root-pass RoboShop@1


