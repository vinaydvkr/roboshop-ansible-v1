- name: create mongodb server
  hosts: mongodb
  become: yes
  tasks:
    - name: Copy MongoDB repo file
      ansible.builtin.copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo

    - name: Install MongoDB
      ansible.builtin.package:
        name: mongodb-org
        state: present

    - name: Start and enable mongod
      ansible.builtin.service:
        name: mongod
        state: started
        enabled: yes

    - name: Update mongod.conf
      ansible.builtin.replace:
        path: /etc/mongod.conf
        regexp: '127.0.0.1'
        replace: '0.0.0.0'

    - name: Restart mongod
      ansible.builtin.service:
        name: mongod
        state: restarted

