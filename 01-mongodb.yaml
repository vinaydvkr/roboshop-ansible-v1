- name: create mongodb server
  hosts: mongodb
  become: yes
  tasks:
    ansible.builtin.copy:
      src: copy mongo repo
      dest: /etc/yum.repos.d/mongo.repo

- name: Install  mongo db
  ansible.builtin.package:
    name: mongodb-org
    state: present
  
- name: start and enable mongod
  ansible.builtin.service:
    name: mongod
    state: started
    enabled: yes

- name: update the mongod.conf
  ansible.builtin.replace:
    path: /etc/mongod.conf
    regexp: 127.0.0.1
    replace: 0.0.0.0

- name: Restart the services
  ansible.builtin.service:
    name: mongod
    state: restarted



