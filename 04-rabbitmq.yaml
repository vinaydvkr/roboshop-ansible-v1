- name: Configure RabbitMQ server
  hosts: rabbitmq
  become: true
  tasks:
    
    - name: copy the files
      ansible.builtin.copy:
        src: rabbitmq.repo
        dest: /etc/yum.repos.d/rabbitmq.repo 
  
    - name: Install Erlang and RabbitMQ server
      ansible.builtin.dnf:
        name:
        - erlang
        - rabbitmq-server
        state: present
